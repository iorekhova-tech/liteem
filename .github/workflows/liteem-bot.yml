name: Лайтуем · бот

on:
  schedule:
    - cron: '17 * * * *'           # раз в час — страховка ленты (основное: вебхук Supabase → feed-to-tg)
    # утро 08:00, вечер 21:30 и срез по воде 12/16/20 МСК теперь шлёт Supabase:
    # pg_cron → Edge Function clever-task (supabase/functions/daily-digest, supabase/cron_daily_digest.sql).
    # Здесь они остались только ручным запуском — запасной путь, если Supabase подведёт.
  workflow_dispatch:                # ручной запуск для проверки
    inputs:
      mode:
        description: 'Режим: feed / water_remind / water_snapshot / morning / evening'
        required: false
        default: 'feed'

# чтобы одновременные запуски не толкались
concurrency:
  group: liteem-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Запуск
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
          SCHEDULE:  ${{ github.event.schedule }}
          MODE:      ${{ github.event.inputs.mode }}
        run: python bot.py

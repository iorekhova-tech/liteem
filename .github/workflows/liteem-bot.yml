name: Лайтуем · бот

on:
  schedule:
    - cron: '*/5 * * * *'          # каждые 5 мин — лента в группу
    - cron: '0 9,13,17 * * *'       # 12/16/20 МСК — срез по воде (в группу)
    - cron: '0 5 * * *'             # 08:00 МСК — утренняя мотивация (в личку)
    - cron: '30 18 * * *'           # 21:30 МСК — вечерний итог (в группу)
  workflow_dispatch:                # ручной запуск для проверки
    inputs:
      mode:
        description: 'Режим: feed / water_remind / water_snapshot / morning / evening'
        required: false
        default: 'feed'

# чтобы одновременные запуски не толкались
concurrency:
  group: liteem-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Запуск
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
          SCHEDULE:  ${{ github.event.schedule }}
          MODE:      ${{ github.event.inputs.mode }}
        run: python bot.py
